[project]
name = "rtech-orchestrator"
version = "0.0.1"
description = "Minimal derived-done orchestrator for rtech-agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "loguru>=0.7.0",
  "rtech-frames",
  "fleet-nats",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtech_orchestrator"]

[tool.uv.sources]
rtech-frames = { workspace = true }
