[project]
name = "rtech-webchat"
version = "0.0.1"
description = "Dumb web-chat edge for typed rtech-agents task frames."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.120.0",
  "fleet-nats",
  "loguru>=0.7.0",
  "rtech-frames",
  "uvicorn[standard]>=0.38.0",
  "websockets>=15.0.0",
]

[dependency-groups]
# The edge-integration suite (tests/test_edge_integration.py, issue #143)
# drives the real SSE route over HTTP, so it needs an async HTTP client and an
# SSE reader. These are test-only tools — declared here at the owning package
# boundary rather than leaked into the production `dependencies` above, and
# previously only present transitively (via the mcp dep of openbrain-memory).
dev = [
  "httpx>=0.28",
  "httpx-sse>=0.4",
]

[project.scripts]
rtech-webchat = "rtech_webchat.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtech_webchat"]
