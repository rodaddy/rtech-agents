[project]
name = "rtech-frames"
version = "0.0.1"
description = "Typed NATS wire frames for rtech-agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fleet-core",
  "loguru>=0.7.0",
  "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtech_frames"]
