[project]
name = "rtech-persona"
version = "0.0.1"
description = "Prompt composition: SOUL/USER/KERNEL loader (scan + cap) and slot composer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtech_persona"]
