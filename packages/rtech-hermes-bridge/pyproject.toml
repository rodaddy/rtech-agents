[project]
name = "rtech-hermes-bridge"
version = "0.0.1"
description = "Dumb adapter bridging rtech-agents task frames to existing Hermes gateway agents on the fleet bus."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fleet-nats",
  "loguru>=0.7.0",
  "rtech-frames",
  "rtech-orchestrator",
]

[project.scripts]
rtech-hermes-bridge = "rtech_hermes_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtech_hermes_bridge"]
